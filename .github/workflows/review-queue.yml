name: Review queue (high-risk stories)

on:
  issues:
    types: [labeled]
  schedule:
    - cron: '37 */3 * * *'   # expire held stories older than 24 hours
  workflow_dispatch:

concurrency:
  group: review-queue
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  review:
    if: github.event_name != 'issues' || (github.event.label.name == 'publish' && contains(github.event.issue.labels.*.name, 'held-story') && github.event.sender.login == github.repository_owner)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout scripts
        uses: actions/checkout@v6
        with:
          path: main

      - name: Checkout site
        uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: site

      - name: Publish or expire
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "${{ github.event_name }}" = "issues" ]; then
            python main/scripts/review_queue.py publish --site site --issue "${{ github.event.issue.number }}"
            MSG="Publish held stories from issue #${{ github.event.issue.number }}"
          else
            python main/scripts/review_queue.py expire --site site
            MSG="Expire held stories"
          fi
          (cd main && python -m src.services.events ../site) || echo "::warning::Event records not written"
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .
          git diff --cached --quiet && { echo "No changes."; exit 0; }
          git commit -m "$MSG"
          for i in 1 2 3; do git pull --rebase -q origin gh-pages && git push -q origin gh-pages && exit 0; sleep 10; done
          echo "::error::Could not push to gh-pages"; exit 1
