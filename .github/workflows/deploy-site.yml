name: Deploy site

# Publishes changes to the website (layout, pages, settings such as the
# AdSense ID) without waiting for the next daily run.
on:
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/deploy-site.yml']
  workflow_dispatch:

concurrency:
  group: daily-briefing
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true
          publish_branch: gh-pages
          enable_jekyll: true
