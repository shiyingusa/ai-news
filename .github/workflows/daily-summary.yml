name: Daily AI briefing

on:
  schedule:
    # 11:17 UTC = 6:17 am New York in winter (7:17 am in summer).
    # GitHub can start scheduled runs hours late, so there are backup times;
    # a backup run does nothing if today's issue is already published.
    - cron: '17 11 * * *'
    - cron: '43 11 * * *'
    - cron: '13 12 * * *'
    - cron: '47 12 * * *'
    - cron: '23 13 * * *'
    # Same-day updates: 17:17 UTC = 12:17 pm and 23:17 UTC = 6:17 pm New York (winter).
    - cron: '17 17 * * *'
    - cron: '17 23 * * *'
  workflow_dispatch:      # "Run workflow" button for a manual run
    inputs:
      edition:
        description: "0 = morning issue, 1 = midday update, 2 = evening update"
        default: "0"

concurrency:
  group: daily-briefing
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
      edition: ${{ steps.check.outputs.edition }}
      hours: ${{ steps.check.outputs.hours }}
    steps:
      - id: check
        run: |
          DAY=$(date -u +%F)
          SCHED="${{ github.event.schedule }}"
          EDITION="${{ github.event.inputs.edition || '0' }}"
          [ "$SCHED" = "17 17 * * *" ] && EDITION=1
          [ "$SCHED" = "17 23 * * *" ] && EDITION=2
          POST="https://raw.githubusercontent.com/${{ github.repository }}/gh-pages/_posts/${DAY}-summary-en.md"
          SKIP=false
          # Each edition runs once a day. Triggers can arrive twice (Claude's
          # scheduled task and GitHub's own cron, which is often hours late), so
          # skip when this edition or a later one is already out.
          for E in 0 1 2; do
            if [ "$E" -ge "$EDITION" ] && curl -sf -o /dev/null "https://raw.githubusercontent.com/${{ github.repository }}/gh-pages/_editions/${DAY}-e${E}.txt"; then
              echo "Edition $E for $DAY already published; skipping edition $EDITION."; SKIP=true
            fi
          done
          if [ "$EDITION" = "0" ]; then
            HOURS=24
            if [ "$SKIP" = "false" ] && [ "${{ github.event_name }}" = "schedule" ] && curl -sf -o /dev/null "$POST"; then
              echo "Issue for $DAY already published; skipping."; SKIP=true
            fi
          else
            HOURS=7
            if ! curl -sf -o /dev/null "$POST"; then
              echo "Morning issue for $DAY not published yet; no update."; SKIP=true
            fi
          fi
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"
          echo "edition=$EDITION" >> "$GITHUB_OUTPUT"
          echo "hours=$HOURS" >> "$GITHUB_OUTPUT"

  daily-summary:
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"

      - name: Install dependencies
        run: uv sync

      - name: Prepare config
        run: cp data/config.github.json data/config.json

      - name: Check the model key is set
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "::error::Add the DEEPSEEK_API_KEY secret in Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Run AI Daily Radar
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          REPEAT_CHECK: "1"
          EDITION: ${{ needs.gate.outputs.edition }}
        run: uv run horizon --hours ${{ needs.gate.outputs.hours }}

      - name: Keep the digest archive for next runs
        if: needs.gate.outputs.edition == '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/summaries/*.md 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Archive digest $(date -u +%F)"
          git push || echo "::warning::Could not push the digest archive; the site still deploys."

      - name: Set current date
        run: echo "DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Mark this edition as published
        run: mkdir -p docs/_editions && date -u +%FT%TZ > "docs/_editions/${{ env.DATE }}-e${{ needs.gate.outputs.edition }}.txt"

      - name: Write event records for new stories
        run: python -m src.services.events docs || echo "::warning::Event records not written"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true   # keeps every past issue on the gh-pages branch
          commit_message: "Briefing ${{ env.DATE }} (edition ${{ needs.gate.outputs.edition }})"
          publish_branch: gh-pages
          enable_jekyll: true

      - name: Ask the owner about held high-risk stories
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: python scripts/review_queue.py open --site docs --date "${{ env.DATE }}" --edition "${{ needs.gate.outputs.edition }}" || echo "::warning::Could not open the review issue"

      - name: Notify search engines (IndexNow, Baidu)
        env:
          BAIDU_PUSH_TOKEN: ${{ secrets.BAIDU_PUSH_TOKEN }}
        run: python scripts/indexnow.py --site docs --date "${{ env.DATE }}" --wait 120
