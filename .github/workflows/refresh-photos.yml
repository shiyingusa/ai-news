name: Refresh story photos

# Replaces radar artwork with licensed photos on recent stories that have none.
on:
  workflow_dispatch:
    inputs:
      days:
        description: "How many recent days to check"
        default: "3"

concurrency:
  group: daily-briefing
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Checkout published site
        uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: site

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"

      - name: Install dependencies
        run: uv sync

      - name: Find photos
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: uv run python scripts/refresh_photos.py --site site --days ${{ github.event.inputs.days || '3' }}

      - name: Publish
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "Nothing to publish" && exit 0
          git commit -m "Add licensed photos to recent stories"
          git push
