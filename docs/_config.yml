title: AI Daily Radar
tagline: AI and the frontier tech around it
description: AI and the frontier tech around it (chips, robots, EVs and energy, space, science), picked and explained every morning in English and Chinese.
url: "https://aidailyradar.com"
baseurl: ""
lang: en
locale: en_US
logo: /assets/logo.png
image: /assets/share.png
social:
  name: AI Daily Radar

# ---------------------------------------------------------------------------
# Google AdSense
# Publisher ID (ca-pub-...). Turns on the AdSense script on every page and
# fills in /ads.txt automatically.
adsense_client: "ca-pub-2802182975734564"
# Optional ad unit IDs for the fixed slots. Leave empty to rely on Auto ads.
adsense_slot: ""
adsense_slot_rail: ""
# ---------------------------------------------------------------------------

contact_email: "hello@aidailyradar.com"

markdown: kramdown
kramdown:
  input: GFM
  auto_ids: true
future: true
timezone: America/New_York

collections:
  stories:
    output: true

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-redirect-from

feed:
  path: feed-all.xml

defaults:
  - scope:
      path: ""
    values:
      layout: "page"
      image: /assets/share.png
  - scope:
      path: ""
      type: "stories"
    values:
      layout: "story"
      seo:
        type: WebPage
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "issue"

exclude:
  - ".github"
  - "node_modules"
  - "shots"
  - ".taste-skill"
  - "Gemfile"
  - "Gemfile.lock"
  - "vendor"
